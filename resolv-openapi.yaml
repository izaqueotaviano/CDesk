          type: integer
          nullable: true
        category_name:
          type: string
          readOnly: true
        priority:
          oneOf:
          - $ref: '#/components/schemas/PriorityEnum'
          - $ref: '#/components/schemas/BlankEnum'
        assignee:
          type: integer
          nullable: true
        assignee_name:
          type: string
          nullable: true
          readOnly: true
        tags:
          type: array
          items:
            type: integer
        is_active:
          type: boolean
        order:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - assignee_name
      - category_name
      - id
      - name
    TicketMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        author_name:
          type: string
          readOnly: true
        author_avatar:
          type: string
          nullable: true
          description: |-
            A foto de quem escreveu. Mensagem do sistema não tem — e a UI cai
            nas iniciais, que é o que ela já fazia antes de existir avatar.
          readOnly: true
        author_is_internal:
          type: boolean
          readOnly: true
        body:
          type: string
        is_public:
          type: boolean
          description: Desmarcado = nota interna.
        source:
          $ref: '#/components/schemas/TicketMessageSourceEnum'
        is_first_response:
          type: boolean
          description: Marca a mensagem que definiu first_response_at.
        created_at:
          type: string
          format: date-time
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/TicketAttachment'
          readOnly: true
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/Mention'
          readOnly: true
        edited_at:
          type: string
          format: date-time
          nullable: true
        is_deleted:
          type: boolean
          readOnly: true
        can_edit:
          type: boolean
          description: |-
            Quem vê o botão é quem o backend deixaria usar — a MESMA regra de
            `_pode_mexer_na_mensagem`, para a tela não oferecer o que a API nega.
          readOnly: true
      required:
      - attachments
      - author_avatar
      - author_is_internal
      - author_name
      - body
      - can_edit
      - created_at
      - id
      - is_deleted
      - mentions
    TicketMessageSourceEnum:
      enum:
      - web
      - chat
      - system
      type: string
      description: |-
        * `web` - Sistema
        * `chat` - Chat
        * `system` - Automático
    TicketScopeEnum:
      enum:
      - all
      - teams
      - assigned
      type: string
      description: |-
        * `all` - Todos os tickets
        * `teams` - Apenas os das suas equipes
        * `assigned` - Apenas os atribuídos a ele
    TicketSourceEnum:
      enum:
      - web
      - chat
      - internal
      type: string
      description: |-
        * `web` - Sistema
        * `chat` - Chat ao vivo
        * `internal` - Criado por agente
    TicketStage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 40
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          description: |-
            O que este status significa para SLA, fechamento e relatórios.

            * `new` - Novo
            * `open` - Aberto
            * `pending_customer` - Aguardando retorno
            * `closed` - Fechado
        category_label:
          type: string
          readOnly: true
        color:
          type: string
          maxLength: 7
        order:
          type: integer
          maximum: 32767
          minimum: 0
        is_system:
          type: boolean
          readOnly: true
          description: 'De fábrica: não pode ser apagado nem trocar de categoria.'
        is_active:
          type: boolean
        ticket_count:
          type: integer
          readOnly: true
      required:
      - category
      - category_label
      - id
      - is_system
      - name
      - ticket_count
    TicketStatusEnum:
      enum:
      - new
      - open
      - pending_customer
      - closed
      type: string
      description: |-
        * `new` - Novo
        * `open` - Aberto
        * `pending_customer` - Aguardando retorno
        * `closed` - Fechado
    TicketTag:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 40
        slug:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        color:
          type: string
          maxLength: 7
      required:
      - id
      - name
    TicketTagPill:
      type: object
      description: A etiqueta como a fila e o detalhe a desenham — a pílula colorida.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 40
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        color:
          type: string
          maxLength: 7
      required:
      - id
      - name
      - slug
    TrocarSenha:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
    TwoFactorMethodEnum:
      enum:
      - email
      - totp
      type: string
      description: |-
        * `email` - Código por e-mail
        * `totp` - Aplicativo autenticador
    TypeEnum:
      enum:
      - user
      - team
      type: string
      description: |-
        * `user` - user
        * `team` - team
    UiDensityEnum:
      enum:
      - comfortable
      - compact
      type: string
      description: |-
        * `` - Automático
        * `comfortable` - Confortável
        * `compact` - Compacto
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        kind:
          $ref: '#/components/schemas/UserKindEnum'
        internal_role:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/InternalRoleEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        company:
          type: integer
          nullable: true
        presence:
          $ref: '#/components/schemas/PresenceEnum'
      required:
      - email
      - full_name
      - id
      - kind
    UserAdmin:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          maxLength: 150
        kind:
          $ref: '#/components/schemas/UserKindEnum'
        internal_role:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/InternalRoleEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        client_role:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ClientRoleEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        company:
          type: integer
          nullable: true
        company_name:
          type: string
          readOnly: true
        job_title:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 32
        phone_secondary:
          type: string
          maxLength: 32
        is_active:
          type: boolean
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Último login
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        anonymized_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        invite_status:
          type: string
          description: |-
            `pendente` | `aceito` | `` (só quem entra por Google fica sem status).

            Vale para o AGENTE também: enquanto ele não abre o convite não tem
            senha, e "pendente" na lista é o que avisa o admin de que aquela conta
            ainda não consegue entrar. Sem isso, um agente trancado para fora
            parecia idêntico a um agente ativo.
          readOnly: true
        team_ids:
          type: array
          items:
            type: integer
          readOnly: true
        two_factor_method:
          allOf:
          - $ref: '#/components/schemas/TwoFactorMethodEnum'
          readOnly: true
        avatar_url:
          type: string
          maxLength: 300
        custom_role:
          type: integer
          nullable: true
        custom_role_name:
          type: string
          readOnly: true
        ticket_scope:
          oneOf:
          - $ref: '#/components/schemas/TicketScopeEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - anonymized_at
      - company_name
      - custom_role_name
      - email
      - full_name
      - id
      - invite_status
      - kind
      - last_login
      - last_seen_at
      - team_ids
      - two_factor_method
    UserKindEnum:
      enum:
      - internal
      - client
      type: string
      description: |-
        * `internal` - Interno
        * `client` - Cliente
    VisibilityEnum:
      enum:
      - company_wide
      - requester_only
      type: string
      description: |-
        * `company_wide` - Toda a empresa cliente
        * `requester_only` - Apenas o solicitante
    Watcher:
      type: object
      description: |-
        Seguidor exposto na tela — nasce por @menção (`TicketWatcher`, ver
        `services/mentions.py`); a Fase 2 achou que não havia como sequer LER isso
        no detalhe do ticket, então este campo é a exposição mínima que faltava
        (GAPS.md, achado durante a integração de Chamado). `follow`/`unfollow`,
        abaixo, cobrem o "+ Seguir"/remover manual que o front de referência
        desenha.
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
