  /api/v1/chat/chats/{id}/messages/:
    get:
      operationId: v1_chat_chats_messages_list
      description: |-
        Histórico da conversa — sempre em ordem de id, em três recortes.

        - `after`  → o que chegou depois (reconexão sem perda);
        - `before` → o que veio ANTES (o "carregar mensagens anteriores", em
          conversa longa);
        - `limit`  → o rabo, as N mais recentes.

        Sem parâmetro nenhum devolve a conversa INTEIRA, que continua sendo o
        contrato antigo: o histórico nunca é podado no servidor, só paginado
        a pedido de quem lê.
      parameters:
      - in: query
        name: after
        schema:
          type: string
        description: id da última mensagem já vista
      - in: query
        name: before
        schema:
          type: string
        description: id da mensagem mais antiga já carregada
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: quantas mensagens (as mais recentes)
      - name: offset
        required: false
        in: query
        description: O índice inicial a partir do qual retornar os resultados.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChatMessageList'
          description: ''
