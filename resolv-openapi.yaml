          readOnly: true
        queue_open:
          type: boolean
          readOnly: true
        queue_opens_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
      required:
      - default_team_name
      - queue_open
      - queue_opens_at
    ChatFile:
      type: object
      description: |-
        Mesmo formato do anexo de ticket (`url`, `is_downloadable`) de
        propósito: o componente `<Attachment/>` do front já desenha isso.
      properties:
        id:
          type: integer
          readOnly: true
        filename:
          type: string
          maxLength: 255
        content_type:
          type: string
          maxLength: 120
        size_bytes:
          type: integer
          maximum: 2147483647
          minimum: 0
        scan_status:
          $ref: '#/components/schemas/ScanStatusEnum'
        url:
          type: string
          readOnly: true
        is_downloadable:
          type: boolean
          readOnly: true
      required:
      - content_type
      - filename
      - id
      - is_downloadable
      - size_bytes
      - url
    ChatLink:
      type: object
      description: |-
        Link achado no corpo de uma mensagem (extração no servidor —
        `chat_service.extrair_links`).
      properties:
        url:
          type: string
          format: uri
        chat_id:
          type: integer
        message_id:
          type: integer
        sent_at:
          type: string
          format: date-time
        author_name:
          type: string
      required:
      - author_name
      - chat_id
      - message_id
      - sent_at
      - url
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        author_name:
          type: string
          readOnly: true
        author_is_internal:
          type: boolean
          readOnly: true
        body:
          type: string
          readOnly: true
        is_system:
          type: boolean
        sent_at:
          type: string
          format: date-time
          readOnly: true
        read_at:
          type: string
          format: date-time
          nullable: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/ChatFile'
          readOnly: true
        edited_at:
          type: string
          format: date-time
          nullable: true
        is_deleted:
          type: boolean
          readOnly: true
        can_edit:
          type: boolean
          description: |-
            Mesma regra de `chat_service._pode_mexer_na_mensagem` — quem vê o
            botão é quem a API deixaria usar, não uma segunda verdade no front.

            `context["user"]` é o atalho para quem serializa fora de uma view
            REST — o ChatConsumer (WebSocket) tem `self.user`, não um `request`
            do DRF; inventar um `request` falso ali seria mais frágil do que
            aceitar as duas formas aqui, uma vez, no único lugar que decide.
          readOnly: true
      required:
      - author_is_internal
      - author_name
      - body
      - can_edit
      - files
      - id
      - is_deleted
      - sent_at
    ChatRating:
      type: object
      properties:
        service_score:
          type: integer
          maximum: 32767
          minimum: 0
          title: Nota de atendimento
        resolution_score:
          type: integer
          maximum: 32767
          minimum: 0
          title: Nota de resolução
        justification:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - resolution_score
      - service_score
    ChatReportRow:
      type: object
      description: |-
        Uma linha do relatório do chat, em qualquer eixo.

        Existe para o SCHEMA, e o schema existe para a SPA: sem serializer
        declarado o gerador desistia da view ("unable to guess serializer") e o
        endpoint sumia do `resolv-openapi.yaml` — a tela de relatórios ficava
        com um tipo escrito à mão que nada garantia bater com a resposta.

        Os campos variam por eixo (`?by=`): o eixo `score` conta ocorrências por
        nota e não tem desfechos; os outros três trazem a contagem completa, e só
        `agent` tem a autoavaliação. Por isso quase tudo é opcional aqui — a forma
        é honesta sobre ser condicional, em vez de prometer campos que não vêm.
      properties:
        rotulo:
          type: string
          nullable: true
        total:
          type: integer
        fechados:
          type: integer
        convertidos:
          type: integer
        nao_atendidos:
          type: integer
        nota_atendimento:
          type: number
          format: double
          nullable: true
        nota_resolucao:
          type: number
          format: double
          nullable: true
        nota_do_agente:
          type: number
          format: double
          nullable: true
        espera_media_minutos:
          type: number
          format: double
          nullable: true
        atendimento_medio_minutos:
          type: number
          format: double
          nullable: true
        quantidade:
          type: integer
      required:
      - nota_resolucao
      - rotulo
