  /api/v1/tickets/:
    get:
      operationId: v1_tickets_list
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
        description: '''me'' (minha fila), ''unassigned'' (sem responsável) ou o id
          do agente'
      - in: query
        name: ate
        schema:
          type: string
        description: data de ABERTURA máxima (YYYY-MM-DD), inclusive.
      - in: query
        name: avaliacao
        schema:
          type: string
        description: '`sim` (CSAT respondido) ou `nao` (fechado e ainda sem nota).'
      - in: query
        name: category
        schema:
          type: integer
        description: id da categoria.
      - in: query
        name: company
        schema:
          type: integer
        description: id da empresa
      - in: query
        name: desde
        schema:
          type: string
        description: data de ABERTURA mínima (YYYY-MM-DD), inclusive.
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: limit
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: O índice inicial a partir do qual retornar os resultados.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
        description: 'coluna clicada na fila — reference | subject | criado | espera
          | cliente | responsavel | categoria | urgencia | status | justificativa
          | sla — com `-` na frente pra decrescente (ex.: `-criado`).'
      - in: query
        name: priority
        schema:
          type: string
        description: low | normal | high | urgent
      - in: query
        name: q
        schema:
          type: string
        description: busca por assunto ou referência
      - in: query
        name: resolucao
        schema:
          type: string
        description: '`resolvido` (fechado e ainda reabrível) ou `fechado` (encerrado
          automaticamente por falta de resposta, não reabre). Os dois são `status=closed`;
          o que muda é se responder reabre.'
      - in: query
        name: sla
        schema:
          type: string
        description: '''breached'' ou ''at_risk'' — tickets com prazo estourado ou
          próximo'
      - in: query
        name: source
        schema:
          type: string
        description: web | chat | internal
      - in: query
        name: status
        schema:
          type: string
        description: new | open | pending_customer | closed — ou uma LISTA separada
          por vírgula (`new,open`).
      - in: query
        name: team
        schema:
          type: string
        description: slug da equipe
      - in: query
        name: view
        schema:
          type: string
        description: 'visão salva da barra lateral: meus-nao-resolvidos | todos |
          sem-atendimento | nao-resolvidos | em-kanban | nao-atribuidos | resolvidos
          | internos | mencionam-voce | aguardando-voce'
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTicketListList'
          description: ''
    post:
