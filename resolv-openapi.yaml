        title:
          type: string
          maxLength: 150
        body:
          type: string
          maxLength: 400
        url:
          type: string
          maxLength: 300
        ticket_id:
          type: integer
          nullable: true
          readOnly: true
        actor_name:
          type: string
          nullable: true
          readOnly: true
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor_name
      - created_at
      - id
      - kind
      - ticket_id
      - title
    NotificationKindEnum:
      enum:
      - ticket_created
      - ticket_assigned
      - ticket_owner_set
      - ticket_replied
      - ticket_reopened
      - mention
      - sla_warning
      - sla_breached
      - chat_incoming
      - chat_converted
      - announcement
      - attachment_blocked
      - lgpd_deadline
      - kanban_due
      type: string
      description: |-
        * `ticket_created` - Ticket novo
        * `ticket_assigned` - Ticket atribuído
        * `ticket_owner_set` - Dono técnico definido
        * `ticket_replied` - Ticket respondido
        * `ticket_reopened` - Ticket reaberto
        * `mention` - Menção
        * `sla_warning` - SLA próximo do limite
        * `sla_breached` - SLA estourado
        * `chat_incoming` - Chat na fila
        * `chat_converted` - Chat virou chamado
        * `announcement` - Aviso
        * `attachment_blocked` - Anexo bloqueado
        * `lgpd_deadline` - Prazo de pedido LGPD
        * `kanban_due` - Prazo do quadro vencido
    NotificationPreference:
