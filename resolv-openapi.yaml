    SystemConfig:
      type: object
      description: |-
        Os limites em MB acompanham os bytes: quem edita pensa em MB, o
        backend valida em bytes, e nenhum dos dois precisa converter na mão.
      properties:
        attachment_max_bytes:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Tamanho máximo por arquivo (bytes)
          description: 'Regra de produto: 10 MB por arquivo, mídia ou documento.'
        attachment_max_mb:
          type: integer
          readOnly: true
        attachment_max_files_per_message:
          type: integer
          maximum: 32767
          minimum: 0
          title: Máximo de arquivos por mensagem
        attachment_max_bytes_per_message:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Tamanho máximo somado por mensagem (bytes)
          description: Precisa acompanhar (máx. por arquivo × máx. de arquivos), senão
            o usuário esbarra num limite que a tela não anunciou.
        attachment_max_mb_per_message:
          type: integer
          readOnly: true
        auto_close_pending_hours:
          type: integer
          maximum: 32767
          minimum: 0
          title: Horas corridas sem resposta do cliente até fechar automaticamente
          description: Ticket parado em 'aguardando o cliente' por mais que isto é
            fechado sozinho. Conta em horas corridas (relógio normal, não horário
            comercial). Zero desliga o fechamento automático.
        auto_close_message:
          type: string
          title: Mensagem enviada ao fechar por falta de resposta
          description: O cliente vê este texto no chamado quando ele fecha sozinho.
        auto_close_warning_hours:
          type: integer
          maximum: 32767
          minimum: 0
          title: Avisar quantas horas antes do fechamento automático
          description: 'Ex.: prazo de 72h e aviso de 24h manda o lembrete com 48h
            de espera (faltando 24h para fechar). Zero desliga o aviso.'
        auto_close_warning_message:
          type: string
          title: Mensagem do aviso prévio de fechamento
          description: O cliente vê este texto antes do fechamento automático acontecer.
        csat_enabled:
          type: boolean
          title: Enviar pesquisa de satisfação ao fechar o ticket
        csat_expires_days:
          type: integer
          maximum: 32767
          minimum: 0
          title: Dias de validade do link da pesquisa
          description: Depois disso o link para de aceitar resposta. Prazo curto demais
            derruba a taxa de resposta; longo demais deixa um link vivo à toa.
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachment_max_mb
      - attachment_max_mb_per_message
      - updated_at
