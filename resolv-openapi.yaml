openapi: 3.0.3
info:
  title: Resolv API
  version: 0.1.0
paths:
  /api/v1/announcements/:
    get:
      operationId: v1_announcements_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: O índice inicial a partir do qual retornar os resultados.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementList'
          description: ''
    post:
      operationId: v1_announcements_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Announcement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Announcement'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
  /api/v1/announcements/{id}/:
    get:
      operationId: v1_announcements_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este aviso.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
    put:
      operationId: v1_announcements_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este aviso.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Announcement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Announcement'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
    patch:
      operationId: v1_announcements_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este aviso.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncement'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
    delete:
      operationId: v1_announcements_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este aviso.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/announcements/{id}/dismiss/:
    post:
      operationId: v1_announcements_dismiss_create
      description: |-
        Usuário oculta o aviso do próprio dashboard (não o apaga).

        Só se pode dispensar o que se poderia ver: sem o filtro de audiência,
        `get_object()` cairia em `Announcement.objects.all()` e um cliente
        conseguiria dispensar — e assim CONFIRMAR a existência de — um aviso
        interno pelo id. 404 para o que está fora da audiência não vaza nada.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este aviso.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Announcement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Announcement'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
  /api/v1/attachments/{id}/:
    get:
      operationId: v1_attachments_retrieve
      description: Download autenticado de anexo (D13), sujeito à quarentena (D19).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/audit/lgpd/:
    get:
      operationId: v1_audit_lgpd_list
      description: |-
        Pedidos LGPD.

        Criar o pedido **não** executa nada. Anonimização é irreversível: precisa
        de identidade conferida (`verify`) e aprovação antes de `execute`.
      parameters:
      - name: limit
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: O índice inicial a partir do qual retornar os resultados.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDataSubjectRequestList'
          description: ''
    post:
      operationId: v1_audit_lgpd_create
      description: |-
        Pedidos LGPD.

        Criar o pedido **não** executa nada. Anonimização é irreversível: precisa
        de identidade conferida (`verify`) e aprovação antes de `execute`.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSubjectRequest'
          description: ''
  /api/v1/audit/lgpd/{id}/:
    get:
      operationId: v1_audit_lgpd_retrieve
      description: |-
        Pedidos LGPD.

        Criar o pedido **não** executa nada. Anonimização é irreversível: precisa
        de identidade conferida (`verify`) e aprovação antes de `execute`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este pedido LGPD.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSubjectRequest'
          description: ''
    patch:
      operationId: v1_audit_lgpd_partial_update
      description: |-
        Pedidos LGPD.

        Criar o pedido **não** executa nada. Anonimização é irreversível: precisa
        de identidade conferida (`verify`) e aprovação antes de `execute`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este pedido LGPD.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDataSubjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDataSubjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDataSubjectRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSubjectRequest'
          description: ''
  /api/v1/audit/lgpd/{id}/download/:
    get:
      operationId: v1_audit_lgpd_download_retrieve
      description: Download do pacote de portabilidade (LGPD art. 18).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/zip:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/audit/lgpd/{id}/execute/:
    post:
      operationId: v1_audit_lgpd_execute_create
      description: Dispara a execução em background, registrando quem apertou o botão.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este pedido LGPD.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSubjectRequest'
          description: ''
  /api/v1/audit/lgpd/{id}/redact/:
    post:
      operationId: v1_audit_lgpd_redact_create
      description: Redige um campo apontado por `redaction_candidates`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este pedido LGPD.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSubjectRequest'
          description: ''
  /api/v1/audit/lgpd/{id}/redaction_candidates/:
    get:
      operationId: v1_audit_lgpd_redaction_candidates_retrieve
      description: |-
        Trechos com PII provável em texto livre — para revisão humana.

        Só sugere. Regex que apaga sozinho destrói conteúdo legítimo, e
        "irreversível" é a palavra que desqualifica o automático.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este pedido LGPD.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSubjectRequest'
          description: ''
  /api/v1/audit/lgpd/{id}/reject/:
    post:
      operationId: v1_audit_lgpd_reject_create
      description: A LGPD exige informar o motivo da negativa — então ele é obrigatório.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este pedido LGPD.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSubjectRequest'
          description: ''
  /api/v1/audit/lgpd/{id}/verify/:
    post:
      operationId: v1_audit_lgpd_verify_create
      description: |-
        Registra COMO a identidade do titular foi confirmada.

        Executar anonimização sem isso é o próprio vetor de ataque: basta um
        e-mail se passando pelo titular para destruir um cadastro.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este pedido LGPD.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DataSubjectRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSubjectRequest'
          description: ''
  /api/v1/audit/logs/:
    get:
      operationId: v1_audit_logs_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: O índice inicial a partir do qual retornar os resultados.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit/logs/{id}/:
    get:
      operationId: v1_audit_logs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este log de auditoria.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/audit/retention/:
    get:
      operationId: v1_audit_retention_list
      description: |-
        Ciclos de retenção (D18).

        É o que torna o dry-run revisável: sem esta tela, "simular antes de ligar"
        seria uma linha de log que ninguém lê.
      parameters:
      - name: limit
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: O índice inicial a partir do qual retornar os resultados.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRetentionRunList'
          description: ''
  /api/v1/audit/retention/{id}/:
    get:
      operationId: v1_audit_retention_retrieve
      description: |-
        Ciclos de retenção (D18).

        É o que torna o dry-run revisável: sem esta tela, "simular antes de ligar"
        seria uma linha de log que ninguém lê.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este ciclo de retenção.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionRun'
          description: ''
  /api/v1/audit/retention/{id}/review/:
    post:
      operationId: v1_audit_retention_review_create
      description: |-
        Registra que alguém olhou este relatório — é o que destrava o
        expurgo efetivo. Ver `retention._blocking_reason`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este ciclo de retenção.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionRun'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RetentionRun'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RetentionRun'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionRun'
          description: ''
  /api/v1/audit/retention/simulate/:
    post:
      operationId: v1_audit_retention_simulate_create
      description: Roda uma simulação agora, sob demanda.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionRun'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RetentionRun'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RetentionRun'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionRun'
          description: ''
  /api/v1/audit/ticket-access/:
    get:
      operationId: v1_audit_ticket_access_list
      description: Quem leu ticket de equipe restrita — incluindo tentativas negadas.
      parameters:
      - name: limit
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: O índice inicial a partir do qual retornar os resultados.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTicketAccessLogList'
          description: ''
  /api/v1/audit/ticket-access/{id}/:
    get:
      operationId: v1_audit_ticket_access_retrieve
      description: Quem leu ticket de equipe restrita — incluindo tentativas negadas.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este log de acesso a ticket.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketAccessLog'
          description: ''
  /api/v1/auth/2fa/:
    post:
      operationId: v1_auth_2fa_create
      description: 'Segunda etapa do login: valida o código e só então cria a sessão.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/2fa/confirm/:
    post:
      operationId: v1_auth_2fa_confirm_create
      description: Confirma a ativação com um código válido do método escolhido.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/2fa/disable/:
    post:
      operationId: v1_auth_2fa_disable_create
      description: |-
        Desativa mediante um código válido do método atual.

        Código, e não senha: os internos entram por Google e nem TÊM senha
        utilizável — pedir senha aqui deixaria metade dos usuários sem saída.
        Exigir o código também prova posse do fator que está sendo removido.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/2fa/request-code/:
    post:
      operationId: v1_auth_2fa_request_code_create
      description: |-
        Envia um código por e-mail para autorizar a DESATIVAÇÃO (método e-mail).
        Quem usa TOTP não precisa: o aplicativo já gera o código.
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/2fa/resend/:
    post:
      operationId: v1_auth_2fa_resend_create
      description: Reenvia o código por e-mail durante o login pendente.
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/2fa/setup/:
    post:
      operationId: v1_auth_2fa_setup_create
      description: |-
        Inicia a ativação. Nada muda no usuário até confirmar um código válido:
        o segredo/código pendente vive na sessão, não no banco.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/2fa/status/:
    get:
      operationId: v1_auth_2fa_status_retrieve
      description: Estado da verificação do PRÓPRIO usuário — a tela 'Minha conta'.
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
