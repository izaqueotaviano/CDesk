components:
  schemas:
    ActionEnum:
      enum:
      - create
      - update
      - delete
      - status_change
      - assign
      - login
      - config_change
      - export
      - anonymize
      - scan_blocked
      type: string
      description: |-
        * `create` - Criação
        * `update` - Alteração
        * `delete` - Exclusão
        * `status_change` - Mudança de status
        * `assign` - Atribuição
        * `login` - Login
        * `config_change` - Configuração
        * `export` - Exportação
        * `anonymize` - Anonimização
        * `scan_blocked` - Anexo bloqueado pelo antivírus
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 150
        body:
          type: string
        kind:
          $ref: '#/components/schemas/AnnouncementKindEnum'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        is_pinned:
          type: boolean
        is_active:
          type: boolean
        audience_kind:
          $ref: '#/components/schemas/AudienceKindEnum'
        target_roles: {}
        target_teams:
          type: array
          items:
            type: integer
        target_companies:
          type: array
          items:
            type: integer
        target_plans:
          type: array
          items:
            type: integer
        created_by_name:
          type: string
          nullable: true
          readOnly: true
        dismissed:
          type: boolean
          description: Preenchido via annotate na listagem; detalhe consulta direto.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - created_by_name
      - dismissed
