        * `active` - Em atendimento
        * `closed` - Fechado
    ChatTimeline:
      type: object
      description: |-
        O envelope da conversa contínua.

        Existe para o contrato publicado DESCREVER esta resposta. Sem ele o
        gerador dá de ombros ("unable to guess serializer") e o front passa a
        consumir uma rota que o OpenAPI não conhece — o tipo de buraco que só
        aparece quando alguém muda o formato e nada acusa.
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatTimelineMessage'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ChatTimelineSession'
        has_more:
          type: boolean
      required:
      - has_more
      - messages
      - sessions
    ChatTimelineFile:
      type: object
      description: |-
        O anexo no painel: o mesmo formato de sempre — o `<Attachment/>` do
        front já o desenha — mais onde e quando ele foi mandado.
      properties:
        id:
          type: integer
          readOnly: true
        filename:
          type: string
          maxLength: 255
        content_type:
          type: string
          maxLength: 120
        size_bytes:
          type: integer
          maximum: 2147483647
          minimum: 0
        scan_status:
          $ref: '#/components/schemas/ScanStatusEnum'
        url:
          type: string
          readOnly: true
        is_downloadable:
          type: boolean
          readOnly: true
        chat_id:
          type: integer
          readOnly: true
        message_id:
          type: integer
          readOnly: true
        sent_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - chat_id
      - content_type
      - filename
      - id
      - is_downloadable
      - message_id
      - sent_at
      - size_bytes
      - url
    ChatTimelineMedia:
