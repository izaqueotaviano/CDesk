# /etc/nginx/snippets/resolv-proxy.conf — o proxy para o processo Python.
proxy_pass http://resolv_app;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;     # sobrescreve o do cliente — obrigatório
proxy_set_header X-Request-ID      $request_id; # o mesmo id nos dois logs
proxy_set_header Connection        "";
proxy_redirect off;
# proxy_read_timeout NÃO fica aqui de propósito: 60s já é o padrão do
# próprio nginx (repetir o valor padrão aqui impediria o location /ws/ de
# sobrescrever para 3600s — nginx rejeita a MESMA diretiva repetida duas
# vezes no mesmo bloco, mesmo com valores diferentes, "directive is
# duplicate", testado ao vivo). Quem precisar de um valor diferente do
# padrão declara depois do include, como /ws/ já faz.
proxy_connect_timeout 5s;
proxy_buffering off;   # respostas de export (PDF/CSV) saem em stream
