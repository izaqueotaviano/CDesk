# nginx na frente do resolv: TLS, rate limit, a SPA estática e o proxy da
# API/WebSocket. Inclua em /etc/nginx/sites-enabled/ e ajuste domínio e
# certificados.
#
# O que fica aqui e não no Django, e por quê:
#   - TLS e HSTS: o nginx termina o TLS; o Django recebe X-Forwarded-Proto.
#   - Rate limit por IP: barra o ataque antes de gastar um worker Python.
#   - CSP da SPA: o Django não serve o frontend, então a política dele vai aqui.
#   - client_max_body_size: igual ao teto de upload do Django, senão o nginx
#     devolve 413 antes de o backend explicar o limite.

# ---- rate limit ------------------------------------------------------------
# zona geral folgada (uma pessoa usando a SPA de verdade não chega a 20 r/s)
limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
# login e 2FA: 5 tentativas por minuto por IP, sem burst — força bruta morre aqui
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conexoes:10m;
limit_req_status 429;
limit_conn_status 429;

# WebSocket precisa do Upgrade repassado
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream resolv_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---- http → https ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.exemplo.com.br;

    # ACME (Let's Encrypt) por HTTP-01; tudo o mais vai para HTTPS
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

# ---- o site ------------------------------------------------------------------
server {
    # `listen ... http2` (parâmetro do listen), não a diretiva `http2 on;`
    # separada: essa só existe a partir do nginx 1.25.1 (abr/2023) — testado
    # ao vivo contra o nginx 1.24.0 do repositório padrão do Ubuntu 24.04 LTS
    # (Noble, a distro mais provável do servidor real) e falha com "unknown
    # directive" nessa versão. A forma antiga funciona em qualquer nginx
    # recente (só emite aviso de depreciação nas versões novas, não erro).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.exemplo.com.br;

    ssl_certificate     /etc/letsencrypt/live/app.exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.exemplo.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:resolv_tls:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # esconde a versão (nada de "nginx/1.24.0" na página de erro)
    server_tokens off;

    # ---- headers de segurança (em TODAS as respostas, inclusive erro) --------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP da SPA (Vite gera script/estilo em arquivo, sem inline; o Carbon
    # injeta estilo inline em alguns componentes, daí o unsafe-inline SÓ em
    # style-src). `connect-src 'self' wss:` cobre a API e o WebSocket.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://app.exemplo.com.br; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # 20 MB × 10 arquivos (ATTACHMENT_MAX_*) — alinhado a DATA_UPLOAD_MAX_MEMORY_SIZE
    client_max_body_size 210m;
    client_body_timeout 60s;
    client_header_timeout 15s;
    limit_conn conexoes 40;

    access_log /var/log/nginx/resolv.access.log;
    error_log  /var/log/nginx/resolv.error.log warn;

    # ---- proxy comum ---------------------------------------------------------
    # `proxy_set_header X-Forwarded-Proto $scheme` SOBRESCREVE o que veio do
    # cliente — é isso que torna SECURE_PROXY_SSL_HEADER seguro no Django.
    set $rid $request_id;

    # ---- login e 2FA: a zona estrita ----------------------------------------
    location ~ ^/api/v1/auth/(login|two-factor/verify|two-factor/resend|password/reset)/?$ {
        limit_req zone=login nodelay;
        include /etc/nginx/snippets/resolv-proxy.conf;
    }

    # ---- API -----------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/resolv-proxy.conf;
    }

    # ---- WebSocket (Channels) ------------------------------------------------
    location /ws/ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/snippets/resolv-proxy.conf;
        # proxy_http_version 1.1 já vem do snippet acima — repeti-la aqui
        # (mesmo valor) é erro de sintaxe no nginx 1.24 ("directive is
        # duplicate"), testado ao vivo; só falta o Upgrade/Connection que o
        # snippet não tem.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;  # o socket fica aberto o turno inteiro
        # o mini chat embutido conecta com `?ticket=<token>` na URL
        # (docs/14-seguranca.md §10) — sem isto, o token de acesso de 8h de
        # cada visitante do widget ficaria em texto puro neste access log.
        access_log off;
    }

    # ---- mini chat embutido (docs/14-seguranca.md §10) ------------------------
    # A ÚNICA página do site que aceita ser colocada num iframe de outra
    # origem — o resto do site nunca aceita, daqui vem `frame-ancestors
    # 'none'`/`X-Frame-Options: DENY` no bloco `server`. Por isso este
    # location NÃO repete esses dois headers (e por declarar QUALQUER
    # `add_header`, o nginx já para de herdar os do `server` — replicamos os
    # outros abaixo, como em /assets/ e /). Herdar teria o EFEITO CONTRÁRIO
    # do previsto: múltiplos headers `Content-Security-Policy`/
    # `X-Frame-Options` valem pela combinação MAIS restritiva, então o
    # `'none'` do `server` bloquearia a moldura por cima de qualquer origem
    # que o Django já validou — quem decide framing aqui é só a resposta de
    # `apps.customers.embed_views.embed_chat`.
    location /embed/ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/snippets/resolv-proxy.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # a URL carrega o e-mail declarado e a assinatura HMAC dele — não
        # sobra em log de acesso em texto puro
        access_log off;
    }

    # ---- admin do Django (caminho de DJANGO_ADMIN_URL) -----------------------
    location /painel-interno-x7k2/ {
        limit_req zone=login burst=10 nodelay;
        # restrinja à rede da empresa/VPN quando houver:
        # allow 200.100.50.0/24; deny all;
        include /etc/nginx/snippets/resolv-proxy.conf;
    }

    # estáticos do admin/DRF, coletados pelo collectstatic (WhiteNoise também
    # serve; aqui só por eficiência)
    location /static/ {
        alias /srv/resolv/staticfiles/;
        expires 30d;
        access_log off;
    }

    # MEDIA_ROOT NUNCA é servido pelo nginx: anexo sai só pela view
    # autenticada do Django, que reavalia a permissão e registra o acesso.
    location /media/ { return 404; }

    # dotfiles e backups que alguém deixou no webroot
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(bak|sql|env|log|sqlite3?)$ { deny all; }

    # ---- a SPA -------------------------------------------------------------------
    root /srv/resolv/frontend/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # os add_header de cima NÃO herdam num bloco que declara add_header:
        include /etc/nginx/snippets/resolv-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/resolv-headers.conf;
    }
}
