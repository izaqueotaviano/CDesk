# Trechos para o postgresql.conf de produção (inclua via `include_dir` ou cole).
# O default do Postgres é feito para funcionar em qualquer lugar; este é para
# um banco que só o E-Desk usa, atrás de rede privada.

# --- rede: só quem precisa chega -------------------------------------------
listen_addresses = '10.0.0.5'          # IP da rede PRIVADA; nunca '*' com porta exposta
port = 5432
max_connections = 100

# --- TLS obrigatório --------------------------------------------------------
ssl = on
ssl_cert_file = '/etc/postgresql/tls/server.crt'
ssl_key_file  = '/etc/postgresql/tls/server.key'   # 0600, dono postgres
ssl_ca_file   = '/etc/postgresql/tls/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'
ssl_prefer_server_ciphers = on

# --- senhas: SCRAM, nunca md5 -----------------------------------------------
# md5 é reversível por captura + dicionário; scram não expõe a senha nem o hash.
password_encryption = 'scram-sha-256'

# --- limites que viram proteção ---------------------------------------------
statement_timeout = '60s'                       # o app tem 30s no papel dele
idle_in_transaction_session_timeout = '120s'
lock_timeout = '10s'
temp_file_limit = '2GB'                         # uma query ruim não enche o disco

# --- auditoria mínima no log ------------------------------------------------
log_connections = on
log_disconnections = on
log_min_duration_statement = 2000               # só o que demorou > 2s (sem dado em massa)
log_line_prefix = '%m [%p] %u@%d %r '
log_statement = 'ddl'                           # todo ALTER/CREATE/DROP fica registrado
log_checkpoints = on
log_lock_waits = on
