# /etc/nginx/snippets/edesk-proxy.conf — o proxy para o processo Python.
proxy_pass http://edesk_app;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;     # sobrescreve o do cliente — obrigatório
proxy_set_header X-Request-ID      $request_id; # o mesmo id nos dois logs
proxy_set_header Connection        "";
proxy_redirect off;
proxy_read_timeout 60s;
proxy_connect_timeout 5s;
proxy_buffering off;   # respostas de export (PDF/CSV) saem em stream
